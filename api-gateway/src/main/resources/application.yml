server:
  port: 8080
spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "${APP_FRONTEND_ORIGIN:http://localhost:3000}"
            allowedMethods: "*"
            allowedHeaders: "*"
      routes:
        - id: product-service
          uri: lb://PRODUCT-SERVICE
          predicates:
            - Path=/api/products/**
eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
